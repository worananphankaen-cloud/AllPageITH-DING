<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GOSOFT - Login Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #10B981;
            --primary-green-hover: #059669;
            --primary-red: #E11D48;
            --bg-body: #0F172A;
            --bg-card: rgba(30, 41, 59, 0.85);
            --border-color: #334155;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-green), var(--primary-red));
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            margin-top: 14px;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.25);
        }

        .remember-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .remember-group input[type="checkbox"] {
            accent-color: var(--primary-green);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--primary-green);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-login:hover {
            background-color: var(--primary-green-hover);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .error-msg {
            background: rgba(225, 29, 72, 0.15);
            border: 1px solid rgba(225, 29, 72, 0.3);
            color: var(--primary-red);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            margin-bottom: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <svg width="140" height="36" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
                <rect width="200" height="50" rx="10" fill="#E11D48"/>
                <text x="18" y="35" font-family="'Prompt', sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF">GOSOFT</text>
                <circle cx="168" cy="25" r="7" fill="#10B981"/>
            </svg>
            <div class="brand-title">IT Hardware Command Center</div>
            <div class="brand-subtitle">กรุณาลงชื่อเข้าใช้งานระบบ</div>
        </div>

        <div class="error-msg" id="errorMsg">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="กรอกชื่อผู้ใช้" required autocomplete="off">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="กรอกรหัสผ่าน" required>
            </div>

            <label class="remember-group">
                <input type="checkbox" id="rememberMe">
                <span>จดจำ Username ในเครื่องนี้</span>
            </label>

            <button type="submit" class="btn-login">เข้าสู่ระบบ ➔</button>
        </form>
    </div>

    <script>
        // ฐานข้อมูลผู้ใช้ที่เข้ารหัสรหัสผ่านด้วย SHA-256
        // - admin / 123  -> SHA-256: a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3
        // - ding / 456   -> SHA-256: b3a82ce05a761e05a3036e52003dd32...
// ฐานข้อมูลผู้ใช้ที่เข้ารหัสรหัสผ่านด้วย SHA-256
const USERS_DB = {
    "admin": "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3", // Pass: 123
    "ding": "a665a45920422f9d417e4867efdc4fb8a04a1f3fff1fa07e998e86f7f7a27ae3",  // Pass: 456
    "boom": "03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4"   // Pass: 1234 (แก้ไขตรงนี้)
};

        // ฟังก์ชันแปลงข้อความธรรมดาเป็น SHA-256 Hash
        async function hashSHA256(str) {
            const buffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // ตรวจสอบ Remember Me และการ Login ซ้ำ
        window.onload = () => {
            if (localStorage.getItem("isLoggedIn") === "true") {
                window.location.href = "dashboard.html";
                return;
            }

            const savedUser = localStorage.getItem("rememberedUser");
            if (savedUser) {
                document.getElementById("username").value = savedUser;
                document.getElementById("rememberMe").checked = true;
            }
        };

        async function handleLogin(event) {
            event.preventDefault();

            const userIn = document.getElementById("username").value.trim().toLowerCase();
            const passIn = document.getElementById("password").value.trim();
            const rememberMe = document.getElementById("rememberMe").checked;
            const errorMsg = document.getElementById("errorMsg");

            // แปลงรหัสผ่านที่กรอกเป็น SHA-256 Hash
            const inputHash = await hashSHA256(passIn);

            // ตรวจสอบ Username และ Hash Password
            if (USERS_DB[userIn] && USERS_DB[userIn] === inputHash) {
                // จัดการ Remember Me
                if (rememberMe) {
                    localStorage.setItem("rememberedUser", userIn);
                } else {
                    localStorage.removeItem("rememberedUser");
                }

                // บันทึก Session
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("loginUser", userIn);
                localStorage.setItem("lastActivity", new Date().getTime().toString());

                window.location.href = "index.html";
            } else {
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
